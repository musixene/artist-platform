name: Regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: docker build -t artist-platform-ci .
      - name: Verify runtime distribution notices
        run: docker run --rm --entrypoint sh artist-platform-ci -c 'test -s /app/LICENSE && test -s /app/NOTICE && test -s /app/CHANGES.md'
